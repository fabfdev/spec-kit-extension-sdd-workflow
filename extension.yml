schema_version: "1.0"

extension:
  id: "sdd-workflow"
  name: "SDD Workflow Extra"
  version: "4.2.0"
  description: "Adds product PRD, Software Design Document (SDD), local Kanban (docs/kanban/), lean bug/tech-debt fixes and item closing (finish) to spec-kit. One markdown file per item, committed with the work. No external services."
  author: "Felipe Faustini"
  repository: "https://github.com/fabfdev/spec-kit-extension-sdd-workflow"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"

provides:
  commands:
    - name: "speckit.sdd-workflow.setup"
      file: "commands/speckit.sdd-workflow.setup.md"
      description: "Initialize the SDD workflow: docs/kanban/ (schema + status lifecycle) and docs/health/scan.md. Run once per project."

    - name: "speckit.sdd-workflow.product-prd"
      file: "commands/speckit.sdd-workflow.product-prd.md"
      description: "Create the product-level PRD (docs/core/prd.md). Run once at project start."

    - name: "speckit.sdd-workflow.sdd"
      file: "commands/speckit.sdd-workflow.sdd.md"
      description: "Create the Software Design Document (docs/core/sdd.md). Run after the product PRD."

    - name: "speckit.sdd-workflow.fix-bug"
      file: "commands/speckit.sdd-workflow.fix-bug.md"
      description: "Register and fix a bug on its own branch: regression test, test gate, one commit, PR."

    - name: "speckit.sdd-workflow.fix-debt"
      file: "commands/speckit.sdd-workflow.fix-debt.md"
      description: "Register and resolve technical debt on its own branch: test gate, one commit, PR."

    - name: "speckit.sdd-workflow.implement-all"
      file: "commands/speckit.sdd-workflow.implement-all.md"
      description: "Implement all remaining tasks of a feature, one fresh Opus subagent per task with a short report; stops on the first problem."

    - name: "speckit.sdd-workflow.finish"
      file: "commands/speckit.sdd-workflow.finish.md"
      description: "Confirm and merge an item's PR, update the default branch, close its kanban entry and delete the branch."

    - name: "speckit.sdd-workflow.import-notion"
      file: "commands/speckit.sdd-workflow.import-notion.md"
      description: "One-time migration from a v1.x Notion Kanban board into docs/kanban/."

tags:
  - "sdd"
  - "product-prd"
  - "architecture"
  - "bug-tracking"
  - "tech-debt"
